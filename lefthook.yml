pre-commit:
  jobs:
    - script: git-check
      runner: bash
    - name: Lint Ansible
      run: ansible-lint .
    - name: Run Molecule tests
      run: molecule test -s default

checks:
  jobs:
    - name: Lint Ansible
      run: ansible-lint .
    - name: Run Molecule tests
      run: molecule test -s default
